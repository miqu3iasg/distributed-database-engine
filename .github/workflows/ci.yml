name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Verify (compile, tests, ArchUnit, forbidden-apis)
        run: mvn -B -q verify

  evidence:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Generate docs/EVIDENCE.md
        run: |
          {
            echo "# GeoDB Evidence Ledger"
            echo ""
            echo "Generated by CI. Never hand-edited."
            echo ""
            echo "## Commit"
            echo "- SHA: ${{ github.sha }}"
            echo "- Ref: ${{ github.ref }}"
            echo "- Actor: ${{ github.actor }}"
            echo "- CI run ID: ${{ github.run_id }}"
            echo "- CI run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "## Build"
            echo "- Result: passed"
            echo "- Tool: Maven"
            echo "- Command: mvn -B -q verify"
            echo ""
            echo "## Environment"
            echo "- Java: 25 (Temurin)"
            echo "- Maven: 3.9+"
            echo ""
            echo "## Guards"
            echo "- ArchUnit determinism rules: passed"
            echo "- forbidden-apis: passed"
            echo ""
            echo "## Simulation"
            echo "- Seeds executed: none (Phase 0 setup; no simulation campaign yet)"
            echo "- Regression corpus: empty"
          } > docs/EVIDENCE.md

      - name: Upload EVIDENCE.md as artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence-md
          path: docs/EVIDENCE.md
